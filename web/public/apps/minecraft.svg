<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- Original drawing (no official artwork): a landscape made of cubes. -->
  <rect width="320" height="200" fill="#7ec0ff"/>
  <rect x="236" y="24" width="40" height="40" fill="#fff3a0"/>
  <g fill="#fff">
    <rect x="30" y="34" width="60" height="20"/>
    <rect x="50" y="24" width="40" height="10"/>
    <rect x="150" y="54" width="50" height="20"/>
  </g>

  <!-- far hills -->
  <g fill="#4d9a3f">
    <rect x="0" y="110" width="80" height="50"/>
    <rect x="40" y="90" width="40" height="20"/>
    <rect x="200" y="100" width="120" height="60"/>
    <rect x="240" y="80" width="40" height="20"/>
  </g>

  <!-- tree -->
  <rect x="140" y="80" width="20" height="60" fill="#6b4423"/>
  <g fill="#2f7a2b">
    <rect x="110" y="40" width="80" height="40"/>
    <rect x="130" y="20" width="40" height="20"/>
  </g>
  <rect x="130" y="50" width="20" height="10" fill="#3f9a38"/>

  <!-- ground: grass on dirt -->
  <rect y="140" width="320" height="20" fill="#5fb548"/>
  <rect y="160" width="320" height="40" fill="#8a5a33"/>
  <g fill="#6f4627">
    <rect x="20" y="170" width="20" height="10"/><rect x="100" y="180" width="20" height="10"/>
    <rect x="180" y="168" width="20" height="10"/><rect x="260" y="182" width="20" height="10"/>
  </g>
  <g fill="#4d9a3f">
    <rect x="40" y="140" width="20" height="10"/><rect x="200" y="140" width="40" height="10"/>
  </g>

  <!-- a block being placed -->
  <rect x="70" y="100" width="40" height="40" fill="#9aa0a6"/>
  <rect x="70" y="100" width="40" height="8" fill="#c3c8cd"/>
  <g fill="#3de0ff">
    <rect x="80" y="116" width="8" height="8"/><rect x="94" y="122" width="6" height="6"/>
  </g>
</svg>
